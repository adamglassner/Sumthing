<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sumthing calculator for Windows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
.k{transition:filter .08s ease}
.k:hover{filter:brightness(.95)}
.k:active{filter:brightness(.9)}
.dark .k:hover{filter:brightness(1.18)}
.dark .k:active{filter:brightness(1.3)}
.tb:hover{background:rgba(128,128,128,.16)}
.tb.close:hover{background:#C42B1C;color:#FFFFFF}
.ghost:hover:not(:disabled){background:rgba(128,128,128,.16)}
button:focus-visible{outline:2px solid currentColor;outline-offset:-2px}
</style>
</helmet>
<div class="{{mode}}" style="width: 520px; height: 780px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{t.desk}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', Figtree, system-ui, sans-serif; color: {{t.text}}">

<div style="width: 400px; height: 660px; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; background: {{t.win}}; border: 1px solid {{t.winBorder}}; box-shadow: 0 24px 64px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.12)">

<div style="height: 32px; display: flex; align-items: center; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 10px; padding-left: 14px; flex-grow: 1">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4" fill="{{accent}}"></rect><path d="M4 5.5h3.5M5.75 3.75v3.5M9.5 5.5H12M4 10.5h3.5M9.5 9.5H12M9.5 11.5H12" stroke="{{eqFg}}" stroke-width="1.4" stroke-linecap="round"></path></svg>
<span style="font-size: 12px; letter-spacing: .01em">sumthing</span>
</div>
<button class="tb" type="button" aria-label="Minimize" style="width: 46px; height: 32px; border: 0; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"></path></svg></button>
<button class="tb" type="button" aria-label="Maximize" style="width: 46px; height: 32px; border: 0; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"></rect></svg></button>
<button class="tb close" type="button" aria-label="Close" style="width: 46px; height: 32px; border: 0; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></button>
</div>

<div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; min-height: 0">

<div style="display: flex; align-items: center; gap: 4px; padding: 4px 6px 0 6px">
<button class="ghost" type="button" aria-label="Open navigation" style="width: 40px; height: 40px; border: 0; border-radius: 6px; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h13M1.5 8h13M1.5 12.5h13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg></button>
<h1 style="margin: 0; font-size: 20px; font-weight: 600; flex-grow: 1">Standard</h1>
<button class="ghost" type="button" aria-label="History" aria-pressed="{{showHistory}}" onClick="{{toggleHistory}}" style="width: 40px; height: 40px; border: 0; border-radius: 6px; background: {{histBtnBg}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 9a6.5 6.5 0 1 0 1.9-4.6M2.5 2.5v2.4h2.4M9 5.5V9l2.5 1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 0 18px 6px 18px; min-height: 0; font-variant-numeric: tabular-nums">
<div style="font-size: 14px; color: {{t.sub}}; min-height: 20px; text-align: right">{{expr}}</div>
<div aria-live="polite" style="font-family: 'Segoe UI Variable Display', 'Segoe UI', Figtree, system-ui, sans-serif; font-size: {{displaySize}}; font-weight: 600; line-height: 1.15; text-align: right; word-break: break-all">{{shown}}</div>
</div>

<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 0 4px 2px 4px">
<sc-for list="{{memKeys}}" as="m" hint-placeholder-count="5">
<button class="ghost" type="button" aria-label="{{m.aria}}" disabled="{{m.disabled}}" onClick="{{m.pick}}" style="height: 34px; border: 0; border-radius: 4px; background: transparent; color: {{t.text}}; font-size: 12px; font-weight: 600; opacity: {{m.opacity}}">{{m.label}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); gap: 2px; padding: 0 4px 4px 4px; height: 336px; box-sizing: border-box">
<sc-for list="{{keys}}" as="key" hint-placeholder-count="24">
<button class="k" type="button" aria-label="{{key.aria}}" onClick="{{key.pick}}" style="border-radius: 6px; border: 1px solid {{key.bd}}; background: {{key.bg}}; color: {{key.fg}}; font-size: {{key.fs}}; font-weight: {{key.fw}}; font-variant-numeric: tabular-nums">{{key.label}}</button>
</sc-for>
</div>

<sc-if value="{{showHistory}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 72%; display: flex; flex-direction: column; background: {{t.panel}}; border-top: 1px solid {{t.winBorder}}; border-radius: 8px 8px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.12)">
<div style="display: flex; align-items: center; padding: 12px 12px 6px 18px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; flex-grow: 1">History</h2>
<button class="ghost" type="button" onClick="{{clearHistory}}" disabled="{{historyEmpty}}" style="height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: {{t.text}}; font-size: 12px; opacity: {{clearOpacity}}">Clear</button>
<button class="ghost" type="button" aria-label="Close history" onClick="{{toggleHistory}}" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.2"></path></svg></button>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 0 8px 8px 8px; display: flex; flex-direction: column; gap: 2px">
<sc-if value="{{historyEmpty}}" hint-placeholder-val="{{ true }}">
<p style="margin: 12px 10px; font-size: 14px; color: {{t.sub}}">There's no history yet.</p>
</sc-if>
<sc-for list="{{history}}" as="h" hint-placeholder-count="0">
<button class="ghost" type="button" onClick="{{h.pick}}" style="border: 0; border-radius: 6px; background: transparent; color: {{t.text}}; padding: 8px 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-variant-numeric: tabular-nums">
<span style="font-size: 13px; color: {{t.sub}}">{{h.expr}}</span>
<span style="font-size: 22px; font-weight: 600">{{h.result}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#047857","#7C3AED"]},"$preview":{"width":520,"height":780}}'>
class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    this.state = { display: '0', acc: null, op: null, expr: '', fresh: true, err: false, history: [], mem: null, showHistory: false };
  }
  S() { return this.state; }
  fmt(n) {
    if (!isFinite(n)) return null;
    return String(parseFloat(Number(n).toPrecision(12)));
  }
  commas(s) {
    if (s.indexOf('e') >= 0) return s;
    var neg = s[0] === '-';
    var body = neg ? s.slice(1) : s;
    var parts = body.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + parts.join('.');
  }
  calc(a, op, b) {
    if (op === '+') return a + b;
    if (op === '−') return a - b;
    if (op === '×') return a * b;
    if (op === '÷') return b === 0 ? NaN : a / b;
    return b;
  }
  fail(msg) { this.setState({ display: msg, err: true, acc: null, op: null, fresh: true }); }
  digit(d) {
    var s = this.S();
    if (s.err) { this.setState({ display: d, err: false, expr: '', acc: null, op: null, fresh: false }); return; }
    if (s.fresh) { this.setState({ display: d, fresh: false }); return; }
    if (s.display.replace(/[-.]/g, '').length >= 16) return;
    this.setState({ display: s.display === '0' ? d : s.display + d });
  }
  dot() {
    var s = this.S();
    if (s.err || s.fresh) { this.setState({ display: '0.', fresh: false, err: false }); return; }
    if (s.display.indexOf('.') < 0) this.setState({ display: s.display + '.' });
  }
  operator(o) {
    var s = this.S();
    if (s.err) return;
    var cur = parseFloat(s.display);
    var acc = cur;
    if (s.op && !s.fresh) {
      acc = this.calc(s.acc, s.op, cur);
      if (!isFinite(acc)) { this.fail("Can't divide by zero"); return; }
    } else if (s.op && s.fresh) {
      acc = s.acc;
    }
    this.setState({ acc: acc, op: o, expr: this.fmt(acc) + ' ' + o, display: this.fmt(acc), fresh: true });
  }
  equals() {
    var s = this.S();
    if (s.err || !s.op) return;
    var b = parseFloat(s.display);
    var r = this.calc(s.acc, s.op, b);
    var expr = this.fmt(s.acc) + ' ' + s.op + ' ' + this.fmt(b) + ' =';
    if (!isFinite(r)) { this.setState({ expr: expr }); this.fail("Can't divide by zero"); return; }
    var res = this.fmt(r);
    var history = [{ expr: expr, result: res }].concat(s.history).slice(0, 20);
    this.setState({ display: res, acc: null, op: null, expr: expr, fresh: true, history: history });
  }
  unary(kind) {
    var s = this.S();
    if (s.err) return;
    var cur = parseFloat(s.display);
    var r, label;
    if (kind === 'sqr') { r = cur * cur; label = 'sqr(' + this.fmt(cur) + ')'; }
    if (kind === 'sqrt') { if (cur < 0) { this.fail('Invalid input'); return; } r = Math.sqrt(cur); label = '√(' + this.fmt(cur) + ')'; }
    if (kind === 'inv') { if (cur === 0) { this.fail("Can't divide by zero"); return; } r = 1 / cur; label = '1/(' + this.fmt(cur) + ')'; }
    var expr = s.op ? this.fmt(s.acc) + ' ' + s.op + ' ' + label : label;
    this.setState({ display: this.fmt(r), expr: expr, fresh: true });
  }
  percent() {
    var s = this.S();
    if (s.err) return;
    var cur = parseFloat(s.display);
    var r = s.op ? s.acc * cur / 100 : cur / 100;
    this.setState({ display: this.fmt(r), fresh: true });
  }
  negate() {
    var s = this.S();
    if (s.err || s.display === '0') return;
    this.setState({ display: s.display[0] === '-' ? s.display.slice(1) : '-' + s.display });
  }
  back() {
    var s = this.S();
    if (s.err) { this.setState({ display: '0', err: false, fresh: true }); return; }
    if (s.fresh) return;
    var d = s.display;
    var next = (d.length > 1 && !(d.length === 2 && d[0] === '-')) ? d.slice(0, -1) : '0';
    this.setState({ display: next });
  }
  clearEntry() { this.setState({ display: '0', err: false, fresh: true }); }
  clearAll() { this.setState({ display: '0', acc: null, op: null, expr: '', fresh: true, err: false }); }
  memory(kind) {
    var s = this.S();
    var cur = s.err ? 0 : parseFloat(s.display);
    if (kind === 'MC') this.setState({ mem: null });
    if (kind === 'MR' && s.mem !== null) this.setState({ display: this.fmt(s.mem), fresh: true, err: false });
    if (kind === 'M+') this.setState({ mem: (s.mem || 0) + cur, fresh: true });
    if (kind === 'M−') this.setState({ mem: (s.mem || 0) - cur, fresh: true });
    if (kind === 'MS') this.setState({ mem: cur, fresh: true });
  }
  lum(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var c = [0, 2, 4].map(function (i) {
      var v = parseInt(h.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  renderVals() {
    var self = this;
    var s = this.S();
    var dark = this.props.dark ?? false;
    var accent = this.props.accent ?? '#C2410C';
    var eqFg = this.lum(accent) > 0.35 ? '#1A1A1A' : '#FFFFFF';
    var t = dark
      ? { desk: '#15171B', win: '#202020', winBorder: '#3A3A3A', text: '#FFFFFF', sub: '#C8C8C8', num: '#3B3B3B', fn: '#2E2E2E', keyBd: '#454545', panel: '#2B2B2B' }
      : { desk: '#D5DBE2', win: '#F3F3F3', winBorder: '#D2D2D2', text: '#1A1A1A', sub: '#595959', num: '#FFFFFF', fn: '#F9F9F9', keyBd: '#E2E2E2', panel: '#EDEDED' };

    function key(label, kind, aria, fn) {
      var bg = kind === 'num' ? t.num : kind === 'eq' ? accent : t.fn;
      var fg = kind === 'eq' ? eqFg : t.text;
      var bd = kind === 'eq' ? accent : t.keyBd;
      var big = kind === 'num' || kind === 'eq' || kind === 'op';
      return { label: label, aria: aria || label, pick: fn, bg: bg, fg: fg, bd: bd, fs: big ? '20px' : '15px', fw: kind === 'num' ? '600' : '400' };
    }
    function num(d) { return key(d, 'num', d, function () { self.digit(d); }); }
    function op(o, aria) { return key(o, 'op', aria, function () { self.operator(o); }); }

    var keys = [
      key('%', 'fn', 'Percent', function () { self.percent(); }),
      key('CE', 'fn', 'Clear entry', function () { self.clearEntry(); }),
      key('C', 'fn', 'Clear', function () { self.clearAll(); }),
      key('⌫', 'fn', 'Backspace', function () { self.back(); }),
      key('¹⁄ₓ', 'fn', 'Reciprocal', function () { self.unary('inv'); }),
      key('x²', 'fn', 'Square', function () { self.unary('sqr'); }),
      key('√x', 'fn', 'Square root', function () { self.unary('sqrt'); }),
      op('÷', 'Divide by'),
      num('7'), num('8'), num('9'), op('×', 'Multiply by'),
      num('4'), num('5'), num('6'), op('−', 'Minus'),
      num('1'), num('2'), num('3'), op('+', 'Plus'),
      key('±', 'num', 'Positive negative', function () { self.negate(); }),
      num('0'),
      key('.', 'num', 'Decimal separator', function () { self.dot(); }),
      key('=', 'eq', 'Equals', function () { self.equals(); })
    ];

    var memEmpty = s.mem === null;
    var memKeys = [['MC', 'Clear memory'], ['MR', 'Memory recall'], ['M+', 'Memory add'], ['M−', 'Memory subtract'], ['MS', 'Memory store']].map(function (m) {
      var dis = memEmpty && (m[0] === 'MC' || m[0] === 'MR');
      return { label: m[0], aria: m[1], disabled: dis, opacity: dis ? '0.4' : '1', pick: function () { self.memory(m[0]); } };
    });

    var shown = s.err ? s.display : this.commas(s.display);
    var len = shown.length;
    var displaySize = s.err ? '28px' : len <= 10 ? '48px' : len <= 13 ? '40px' : len <= 17 ? '31px' : '25px';

    var history = s.history.map(function (h) {
      return { expr: h.expr, result: self.commas(h.result), pick: function () { self.setState({ display: h.result, expr: h.expr, fresh: true, err: false, acc: null, op: null, showHistory: false }); } };
    });

    return {
      mode: dark ? 'dark' : 'light',
      t: t,
      accent: accent,
      eqFg: eqFg,
      keys: keys,
      memKeys: memKeys,
      expr: s.expr,
      shown: shown,
      displaySize: displaySize,
      showHistory: s.showHistory,
      histBtnBg: s.showHistory ? 'rgba(128,128,128,.18)' : 'transparent',
      toggleHistory: function () { self.setState({ showHistory: !self.state.showHistory }); },
      history: history,
      historyEmpty: history.length === 0,
      clearOpacity: history.length === 0 ? '0.4' : '1',
      clearHistory: function () { self.setState({ history: [] }); }
    };
  }
}
</script>
</body>
</html>
